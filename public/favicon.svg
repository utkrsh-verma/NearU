<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920" />
      <stop offset="100%" stop-color="#0D0E12" />
    </linearGradient>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B81" />
      <stop offset="100%" stop-color="#E05A6D" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners and subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#2A2B32" stroke-width="1.5" />
  
  <!-- NearU Logo Text -->
  <text x="32" y="33" 
        text-anchor="middle" 
        dominant-baseline="central"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="-0.5">
    <tspan fill="#F3F4F6">Near</tspan><tspan fill="url(#coral)">U</tspan>
  </text>
</svg>
